<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Ines</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="stylee.css">
</head>
<body>
  <div class="container text-center mt-5">
    <h1 class="mb-4">🎓 Quiz Ines</h1>
    <div id="start-container">
      <button id="start-btn" class="btn btn-primary btn-lg">Commencer le quiz</button>
    </div>

    <div id="quiz-container" class="d-none">
      <h3 id="question" class="mb-3"></h3>
      <div id="options" class="mb-3"></div>
      <div id="timer" class="mb-3 fw-bold"></div>
      <button id="next-btn" class="btn btn-success d-none">Question suivante</button>
    </div>

    <div id="result-container" class="d-none">
      <h2>Résultat</h2>
      <p id="score-text"></p>
      <canvas id="resultChart" width="300" height="300"></canvas>
      <button id="restart-btn" class="btn btn-primary mt-3">Rejouer</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script1.js"></script>
</body>
</html>
